[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astroquery>=0.4.11",
    "fastapi>=0.162.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "reproject>=0.21.0",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
