<!doctype html>
<html lang="en"><head>
  <link rel="stylesheet" href="/src/styles.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit9: SPHEREx Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
</head><body class="bg-slate-950 text-slate-300 font-sans">
<header class="absolute inset-x-0 top-0 z-30 border-b border-slate-700/50 bg-[#090d1a]/75 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <a href="/" class="flex items-center gap-2.5 font-['Sora'] text-2xl font-bold text-white">
      <img src="/src/assets/orbit9.svg" class="h-16 w-16 object-contain" alt="Orbit9 home" />
    </a>
    <nav class="flex flex-wrap items-center gap-1 text-sm font-medium" aria-label="Primary">
      <a href="/catalog#how" class="rounded-lg px-3 py-2 hover:text-[#34d399]">How it works</a>
      <a href="/catalog#targets" class="rounded-lg px-3 py-2 hover:text-[#34d399]">Targets</a>
      <a href="/catalog#finds" class="rounded-lg px-3 py-2 hover:text-[#34d399]">Student finds</a>
      <a href="/" class="rounded-lg px-3 py-2 hover:text-[#34d399]">Sky map</a>
<div id="session-ui" class="flex flex-wrap items-center gap-3"><a class="btn" href="/signin">Sign in</a></div>
    </nav>
  </div>
</header>
<main class="relative min-h-[100svh] bg-slate-950">
  <h1 class="sr-only">SPHEREx Explorer</h1>
  <div class="h-[100svh] min-h-[32rem]">
  <img id="frame" class="h-[100svh] min-h-[32rem] w-full object-contain" hidden alt="SPHEREx observation" />
  <div id="fallback" hidden><div id="fallback-map" class="h-[100svh] min-h-[32rem] w-full"></div></div>
  </div>
  <div class="absolute bottom-28 left-4 right-24 z-10 max-h-[25svh] overflow-y-auto rounded-xl border border-slate-700/70 bg-slate-950/90 p-4 text-sm text-slate-100 backdrop-blur sm:left-6 sm:right-auto sm:max-w-xl">
    <div class="flex flex-wrap items-center gap-3"><p id="coordinates"></p></div>
    <p id="explorer-status" role="status" aria-live="polite" class="mt-2 flex items-center gap-3">
      <svg id="loading-spinner" class="h-5 w-5 animate-spin text-emerald-400" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <span id="status-text">Searching SPHEREx observations…</span>
    </p>
    <p id="fallback-label" role="status" class="mt-2 text-amber-200"></p>
    <button id="retry-spherex" type="button" class="btn mt-2" hidden>Retry SPHEREx</button>
  </div>
  <div id="controls" hidden>
    <div class="absolute bottom-4 left-4 right-24 z-10 rounded-xl bg-slate-950/85 p-3 text-sm backdrop-blur sm:left-6">
      <label for="epoch">Observation time</label>
      <output id="epoch-value" for="epoch" class="float-right"></output>
      <input id="epoch" type="range" min="0" max="0" step="1" value="0" class="mt-2 block h-8 w-full accent-emerald-400" />
      <div class="flex justify-between text-xs text-slate-400"><span>Older</span><span>Newer</span></div>
    </div>
    <div class="absolute bottom-4 right-3 z-10 flex max-h-[55svh] w-16 flex-col items-center gap-2 rounded-xl bg-slate-950/85 px-2 py-3 text-xs backdrop-blur">
      <label for="band">IR band</label>
      <span aria-hidden="true">Longer</span>
      <input id="band" type="range" min="0" max="0" step="1" value="0" class="w-8 min-h-16 flex-1 accent-emerald-400" style="writing-mode:vertical-lr;direction:rtl;height:24svh" />
      <span aria-hidden="true">Shorter</span>
      <output id="band-value" for="band" class="break-words text-center"></output>
    </div>
  </div>
</main>
<script type="module" src="/src/explorer.ts"></script></body></html>
