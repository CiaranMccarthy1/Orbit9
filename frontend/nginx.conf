server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A cold SPHEREx render downloads 60 MB FITS and can take ~2 minutes.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Same-origin API, so the frontend needs no CORS or VITE_API_BASE_URL.
  location ~ ^/(health|targets|frames|render|combine|rgb|photometry|flags|register|login|me|logout|discoveries|docs|openapi\.json)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /storage/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # /explorer and /catalog are client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
